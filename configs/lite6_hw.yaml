robot:
  _target_: gello.robots.xarm_robot.XArmRobot
  ip: "192.168.1.210"           # TODO: set your Lite6 IP address
  real: true
  control_frequency: 50.0
  max_delta: 0.15
  num_arm_joints: 6
  enable_gripper: false          # Set to false if you don't have a gripper, true to enable
  servo_speed: 0.2              # rad/s, ~8.6 deg/s (default SDK is 0.349 rad/s = 20 deg/s, reduce if robot moves too fast)
  servo_acc: 2.0                 # rad/s^2, ~114 deg/s^2 (default SDK is 8.726 rad/s^2 = 500 deg/s^2, reduce for smoother moves)

agent:
  _target_: gello.agents.gello_agent.GelloAgent
  port: "/dev/ttyUSB0"
  zhonglin_config:
    _target_: gello.agents.gello_agent.ZhonglinRobotConfig
    joint_ids: [0, 1, 2, 3, 4, 5]
    joint_offsets: [2.5201, 2.1898, 2.3114, 0.9661, 2.3916, 0.2215]  # TODO: re-calibrate with all servos
    joint_signs: [1, 1, 1, 1, -1, 1]
    gripper_config: [6, -0.2, -42.0]
    baudrate: 115200

hz: 50
